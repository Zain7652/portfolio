<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" font-family="Inter, Segoe UI, sans-serif">
  <rect width="1600" height="1000" fill="#eef0f4"/>

  <!-- browser chrome -->
  <rect x="80" y="70" width="1440" height="860" rx="16" fill="#ffffff" stroke="#d7dbe3" stroke-width="2"/>
  <rect x="80" y="70" width="1440" height="56" rx="16" fill="#f4f6f9"/>
  <rect x="80" y="110" width="1440" height="16" fill="#f4f6f9"/>
  <circle cx="112" cy="98" r="7" fill="#e2e5ec"/>
  <circle cx="138" cy="98" r="7" fill="#e2e5ec"/>
  <circle cx="164" cy="98" r="7" fill="#e2e5ec"/>
  <rect x="210" y="86" width="420" height="24" rx="12" fill="#e8ebf1"/>

  <!-- app header -->
  <text x="128" y="192" fill="#1f2430" font-size="30" font-weight="700">Shop Inventory Manager</text>
  <rect x="1300" y="168" width="180" height="36" rx="18" fill="#eae9ff"/>
  <text x="1390" y="192" fill="#4f46e5" font-size="18" font-weight="600" text-anchor="middle">28 days left</text>

  <!-- stat cards -->
  <g>
    <rect x="128" y="240" width="410" height="150" rx="14" fill="#f7f8fb" stroke="#e6e9f0"/>
    <text x="156" y="288" fill="#6b7280" font-size="20">Today&#8217;s Sale</text>
    <text x="156" y="344" fill="#1f2430" font-size="40" font-weight="700">Rs 24,850</text>

    <rect x="595" y="240" width="410" height="150" rx="14" fill="#f7f8fb" stroke="#e6e9f0"/>
    <text x="623" y="288" fill="#6b7280" font-size="20">Profit</text>
    <text x="623" y="344" fill="#4f46e5" font-size="40" font-weight="700">Rs 6,120</text>

    <rect x="1062" y="240" width="410" height="150" rx="14" fill="#f7f8fb" stroke="#e6e9f0"/>
    <text x="1090" y="288" fill="#6b7280" font-size="20">Low stock</text>
    <text x="1090" y="344" fill="#1f2430" font-size="40" font-weight="700">7 items</text>
  </g>

  <!-- table -->
  <rect x="128" y="430" width="1344" height="420" rx="14" fill="#ffffff" stroke="#e6e9f0"/>
  <text x="156" y="480" fill="#1f2430" font-size="22" font-weight="600">Inventory</text>
  <line x1="128" y1="506" x2="1472" y2="506" stroke="#eceef3"/>
  <g fill="#9aa1ae" font-size="18">
    <text x="156" y="548">Product</text><text x="760" y="548">Qty</text><text x="960" y="548">Cost</text><text x="1180" y="548">Price</text>
  </g>
  <g fill="#3a4150" font-size="18">
    <text x="156" y="600">Sample item A</text><text x="760" y="600">42</text><text x="960" y="600">Rs 120</text><text x="1180" y="600">Rs 160</text>
    <text x="156" y="650">Sample item B</text><text x="760" y="650">9</text><text x="960" y="650">Rs 85</text><text x="1180" y="650">Rs 110</text>
    <text x="156" y="700">Sample item C</text><text x="760" y="700">120</text><text x="960" y="700">Rs 30</text><text x="1180" y="700">Rs 45</text>
    <text x="156" y="750">Sample item D</text><text x="760" y="750">3</text><text x="960" y="750">Rs 500</text><text x="1180" y="750">Rs 640</text>
    <text x="156" y="800">Sample item E</text><text x="760" y="800">67</text><text x="960" y="800">Rs 15</text><text x="1180" y="800">Rs 25</text>
  </g>

</svg>
